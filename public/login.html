<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Lead Nurture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbf9; --ink:#1a1f26; --muted:#6b727c; --line:#e7e8e3; --soft:#f3f4f0;
  --accent:#2b47c4; --on-accent:#ffffff; --warm:#a16207;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --ink:#e6e8eb; --muted:#9299a3; --line:#262b32; --soft:#1a1e24;
    --accent:#8b9fff; --on-accent:#0c1022; --warm:#e8b75c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --ink:#e6e8eb; --muted:#9299a3; --line:#262b32; --soft:#1a1e24;
  --accent:#8b9fff; --on-accent:#0c1022; --warm:#e8b75c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body)}
.wrap{max-width:680px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:28px}
@media (max-width:480px){.wrap{padding:24px 16px 48px;gap:22px}}
h1{margin:0;font:600 18px/1.2 var(--font-display);letter-spacing:-.01em}
h2{margin:0 0 4px;font:600 22px/1.25 var(--font-display);letter-spacing:-.01em}
p{margin:0}
.meta{font-size:13px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px;max-width:360px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;font-size:14px;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
input:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:500 14px/1.2 var(--font-body);cursor:pointer;align-self:flex-start}
.btn:hover{filter:brightness(1.07)}
.note{font-size:13px;color:var(--warm)}
.note:empty{display:none}
a{color:var(--accent)}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Lead Nurture</h1><p class="meta">AKD AI Solutions · internal</p></header>
  <section>
    <h2>Sign in</h2>
    <p class="meta">This page shows ActiveCampaign data, so it needs your team password.</p>
  </section>
  <form method="post" action="/login" autocomplete="on">
    <div><label for="user">Username</label><input id="user" name="user" type="text" autocomplete="username" value="admin" required></div>
    <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
    <p class="note" id="err" role="alert"></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="meta">Just looking? Open the <a href="/demo">demo with fictional leads</a>. No sign-in needed.</p>
</main>
<script>
  (function () {
    var e = new URLSearchParams(location.search).get("error");
    document.getElementById("err").textContent = e === "locked" ? "Too many attempts. Wait 15 minutes and try again." : e ? "That username or password didn't match." : "";
  })();
</script>
</body>
</html>
